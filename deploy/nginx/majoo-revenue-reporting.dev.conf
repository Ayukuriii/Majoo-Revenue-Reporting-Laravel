# Majoo Revenue Reporting — WSL / local nginx vhost
# SPA and API share http://localhost:8080 (no CORS).
# Public entrypoint is nginx + PHP-FPM, not php artisan serve.
#
# PHP-FPM socket: unix:/run/php/php8.2-fpm.sock
# Change the socket filename if this server runs another PHP version
# (e.g. unix:/run/php/php8.3-fpm.sock).

server {
    listen 80;
    listen [::]:80;
    server_name majoo-revenue-reporting.test;

    root /var/www/html/majoo-revenue-reporting/public;
    index index.php;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only block URIs that *start* with /., e.g. /.env or /.git.
    # A mid-path match would 403 Vite's /@fs/.../node_modules/.vite/... deps.
    location ~ ^/\.(?!well-known) {
        deny all;
    }
}
